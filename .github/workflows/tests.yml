name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The tests start their own PostgreSQL: one pgvector container per run, on a random loopback port.
      - run: docker pull pgvector/pgvector:0.8.1-pg16
      # Installed, not editable, so a file missing from the package fails here too.
      - run: python -m pip install ".[dev]"
      # The backup tests skip without a client of the server's major version: require it instead.
      - name: PostgreSQL client 16 or later
        run: |
          for tool in pg_dump pg_restore; do
            major=$("$tool" --version | grep -oE '[0-9]+' | head -n 1)
            echo "$tool $major"
            [ "$major" -ge 16 ]
          done
      - run: python -m pytest -q
