[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "val3"
dynamic = ["version"]
description = "Session memory for coding agents: verified facts and recipes in PostgreSQL vaults"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "memory", "claude-code", "postgresql", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["psycopg[binary]>=3.2"]

[project.urls]
Repository = "https://github.com/everywan-dev/val3"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
val3 = "val3.cli:main"

[tool.setuptools.dynamic]
version = {attr = "val3.__version__"}

[tool.setuptools.package-data]
val3 = ["*.sql", "*.md", "view.html", "view.js", "view.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
